name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
        
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_test_secret
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Type check with mypy
        run: mypy . || echo "Mypy warnings ignored for now"
        
      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://opspilot:opspilot_test_secret@localhost:5432/opspilot_test
          SYNC_DATABASE_URL: postgresql+psycopg2://opspilot:opspilot_test_secret@localhost:5432/opspilot_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key
        run: pytest tests/

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type check
        run: npm run typecheck || echo "Typecheck warnings ignored for now"
        
      - name: Build
        run: npm run build
